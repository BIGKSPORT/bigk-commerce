name: Admin authentication and shipping staging checks
on:
  push:
    branches: [fix/catalogue-colour-options]
  pull_request:
    paths:
      - 'lib/security.ts'
      - 'lib/myparcel-test.ts'
      - 'app/api/admin/**'
      - 'tests/auth-*'
permissions:
  contents: read
jobs:
  auth-shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx tests/admin-mfa.test.ts
      - run: npm test
      - run: npm run test:launch-safety
      - run: npm run test:customers
      - run: npm run test:backoffice
      - run: npm run test:product-management
      - run: npm run test:myparcel
      - run: npm run test:auth-shipping
      - run: npm run test:payment-journey
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser authentication and navigation
        run: |
          export CHROMIUM_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:product-groups
          npm run test:auth-browser
          node tests/admin-mfa-browser.mjs
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:b10
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:account-confirm-browser
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:customers-browser
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:alpin
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:alpin-vest
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:nano-front
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:self-management
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:fleece-save
          npm run test:checkout-browser
          BIGK_ARTIFACT_DIR="$RUNNER_TEMP/bigk-product-artifacts" npm run test:product-management-browser

      - name: Product management screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-management-review
          path: ${{ runner.temp }}/bigk-product-artifacts/*.png
          if-no-files-found: ignore
