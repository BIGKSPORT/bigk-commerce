name: B2B portal checks
on:
  pull_request:
    paths:
      - 'lib/b2b-*'
      - 'lib/sales-service.ts'
      - 'lib/sales-crm.ts'
      - 'lib/sales-schema.ts'
      - 'lib/sales-db.ts'
      - 'components/sales-crm*'
      - 'app/api/sales/crm/**'
      - 'supabase/sales/**'
      - 'components/b2b-*'
      - 'components/admin-b2b.tsx'
      - 'components/backoffice.tsx'
      - 'app/b2b/**'
      - 'app/api/b2b/**'
      - 'tests/b2b-*'
      - 'scripts/b2b-*'
      - 'supabase/b2b/**'
      - '.github/workflows/b2b-portal.yml'
permissions:
  contents: read
jobs:
  b2b-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/b2b-portal.test.ts tests/b2b-postgres.test.ts tests/sales-portal.test.ts tests/sales-commissions.test.ts tests/sales-crm.test.ts
      - run: node --import tsx tests/b2b-browser.mjs
